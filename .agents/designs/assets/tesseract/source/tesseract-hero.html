<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tesseract hero art (source)</title>
<!-- Source for ../tesseract-hero-*.png. The resting frame of the round-2 A1 tesseract,
     exported as a static image (issue #17, REVIEW.md change 3). No animation.
     Render: Playwright, viewport 600×600, deviceScaleFactor 2 (and 1),
     page.locator('#art').screenshot({ omitBackground: true }).
     ?bg=1 paints the black stage and glow behind it (used for previews only). -->
<style>
html,body{margin:0;background:transparent}
#art{position:relative;width:600px;height:600px;display:grid;place-items:center;perspective:1300px;perspective-origin:50% 42%;overflow:hidden}
body.bg #art{background:radial-gradient(260px 220px at 50% 47%,rgba(130,70,220,.42),transparent 70%),radial-gradient(420px 340px at 50% 50%,rgba(74,29,122,.55),transparent 72%),#000}
.floor{position:absolute;left:50%;bottom:44px;width:440px;height:62px;margin-left:-220px;border-radius:50%;background:radial-gradient(closest-side,rgba(155,107,216,.45),transparent);filter:blur(6px)}
.tess{position:relative;width:340px;height:340px;transform-style:preserve-3d;transform:translateY(-34px) rotateX(-22deg) rotateY(-34deg) scale3d(.8,.8,.8)}
.cube{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:12px;border:1.5px solid rgba(214,190,255,.78);background:linear-gradient(140deg,rgba(201,168,255,.16),rgba(120,70,210,.05) 55%,rgba(255,255,255,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 40px rgba(155,107,216,.18)}
.f-front{transform:translateZ(170px)}.f-back{transform:rotateY(180deg) translateZ(170px)}
.f-right{transform:rotateY(90deg) translateZ(170px)}.f-left{transform:rotateY(-90deg) translateZ(170px)}
.f-top{transform:rotateX(90deg) translateZ(170px)}.f-bottom{transform:rotateX(-90deg) translateZ(170px)}
.inner{transform:scale3d(.46,.46,.46)}
.inner .face{border-width:3.2px;border-color:#E9DCFF;border-radius:20px;background:linear-gradient(140deg,rgba(214,190,255,.34),rgba(155,107,216,.16) 60%,rgba(255,255,255,.10));box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 0 60px rgba(176,128,236,.35)}
.sheet{position:absolute;left:50%;top:50%;width:200px;height:260px;margin:-130px 0 0 -100px;border-radius:24px;border:3px solid rgba(255,255,255,.8);background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(230,215,255,.18));box-shadow:inset 0 1px 0 #fff}
.s1{transform:translateZ(-60px) translateX(-34px);opacity:.75}.s2{transform:translateZ(0);opacity:.88}.s3{transform:translateZ(60px) translateX(34px)}
.s3::before{content:"";position:absolute;left:50%;top:-22px;width:92px;height:40px;margin-left:-46px;border-radius:14px;background:rgba(255,255,255,.92)}
.s3::after{content:"";position:absolute;left:34px;right:40px;top:84px;height:90px;background:linear-gradient(#fff,#fff) 0 0/100% 10px no-repeat,linear-gradient(#fff,#fff) 0 38px/80% 10px no-repeat,linear-gradient(#fff,#fff) 0 76px/62% 10px no-repeat;opacity:.95}
.strut{position:absolute;left:50%;top:50%;width:159px;height:1.5px;background:linear-gradient(90deg,#E9DCFF,rgba(214,190,255,.55));transform-origin:0 50%}
.strut::after{content:"";position:absolute;right:-4px;top:-3.25px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px rgba(201,168,255,.9)}
.st1{transform:rotateY(45deg) rotateZ(35.26deg) translateX(135.4px)}.st2{transform:rotateY(45deg) rotateZ(-35.26deg) translateX(135.4px)}
.st3{transform:rotateY(-45deg) rotateZ(35.26deg) translateX(135.4px)}.st4{transform:rotateY(-45deg) rotateZ(-35.26deg) translateX(135.4px)}
.st5{transform:rotateY(135deg) rotateZ(35.26deg) translateX(135.4px)}.st6{transform:rotateY(135deg) rotateZ(-35.26deg) translateX(135.4px)}
.st7{transform:rotateY(-135deg) rotateZ(35.26deg) translateX(135.4px)}.st8{transform:rotateY(-135deg) rotateZ(-35.26deg) translateX(135.4px)}
</style>
</head>
<body>
<script>if (location.search.includes('bg=1')) document.body.className = 'bg';</script>
<div id="art" aria-hidden="true">
  <div class="floor"></div>
  <div class="tess">
    <div class="cube outer"><div class="face f-front"></div><div class="face f-back"></div><div class="face f-right"></div><div class="face f-left"></div><div class="face f-top"></div><div class="face f-bottom"></div></div>
    <div class="strut st1"></div><div class="strut st2"></div><div class="strut st3"></div><div class="strut st4"></div>
    <div class="strut st5"></div><div class="strut st6"></div><div class="strut st7"></div><div class="strut st8"></div>
    <div class="cube inner"><div class="face f-front"></div><div class="face f-back"></div><div class="face f-right"></div><div class="face f-left"></div><div class="face f-top"></div><div class="face f-bottom"></div>
      <div class="sheet s1"></div><div class="sheet s2"></div><div class="sheet s3"></div></div>
  </div>
</div>
</body>
</html>
